openapi: 3.2.0
info:
  title: A2 Milk Company Search API
  version: 1.0.0
  description: 'Operations tagged Search across 2 of this provider''s published API definitions: a2-milk-company-careers-openapi.json, a2-milk-company-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://careers.thea2milkcompany.com
tags:
- name: Search
paths:
  /api/search:
    put:
      operationId: searchSite
      summary: Full-text search across every indexed page
      description: Uses PUT rather than POST because the operation is idempotent and carries a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                searchTerm:
                  type: string
                page:
                  type: integer
                  minimum: 0
                  default: 0
                limit:
                  type: integer
                  minimum: 1
                  default: 10
                filters:
                  type: string
                  description: Algolia filter expression.
                sortBy:
                  type: string
                  enum:
                  - alphabetical
      responses:
        '200':
          description: Matching pages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      totalResults:
                        type: integer
                      totalPages:
                        type: integer
                    required:
                    - items
                    - totalResults
                    - totalPages
                required:
                - success
      tags:
      - Search
    servers:
    - url: https://careers.thea2milkcompany.com
x-refined-from:
- a2-milk-company-careers-openapi.json
- a2-milk-company-openapi.yml

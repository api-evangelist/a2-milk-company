aid: a2-milk-company

name: The a2 Milk Company

description: The a2 Milk Company is a premium branded dairy nutrition company listed on the ASX and NZX. It focuses
  only on products that contain the A2 beta-casein protein type. Its US consumer brand, a2 Milk®, is sold as 100% real
  cows' milk from grain- and grass-fed cows. The corporate site (thea2milkcompany.com) carries investor, sustainability,
  governance and company news, including research on infant formula made with a2-type protein. Its careers site
  (careers.thea2milkcompany.com) publishes a small read-only OpenAPI 3.1 description, an llms.txt index and an MCP endpoint.

